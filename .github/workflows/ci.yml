name: CI

on:
  push:
    branches: [master, develop, 'chore/**']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: thinaticsystem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, tests, browser, docs, delivery checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # immutable historical baseline must exist even for shallow PR checkouts
      - name: Historical baseline build Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.1
        with:
          node-version-file: .baseline-node-version
      - name: Preserve baseline executable before candidate setup
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "BASELINE_NODE_EXECUTABLE=" + process.execPath + "\n")'
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: |
          corepack enable
          corepack pnpm --version
      - name: Install dependencies
        run: |
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Performance policy version contract
        run: corepack pnpm run test:performance-policy
      - name: Preview delivery contract
        run: corepack pnpm run test:preview-contract
      - name: Lint
        run: corepack pnpm run lint
      - name: Unit tests
        run: corepack pnpm run test
      - name: Known-defect contract fixtures
        run: corepack pnpm run test:known-defects:contract
      - name: Known-defect raw gate
        run: corepack pnpm run test:known-defects
      - name: Functional performance budget contract fixtures
        run: corepack pnpm run test:budget-contract
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Paired performance contract fixtures
        run: corepack pnpm run test:paired-contract
      - name: Production build
        id: build
        run: corepack pnpm run build
      - name: Record verified preview provenance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { mkdirSync, writeFileSync } = require('node:fs');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sha !== process.env.GITHUB_SHA) throw new Error(`checked out ${sha}, expected ${process.env.GITHUB_SHA}`);
          mkdirSync('.artifacts', { recursive: true });
          writeFileSync('.artifacts/preview-provenance.json', JSON.stringify({ schema: 1, repository: process.env.GITHUB_REPOSITORY, sha, artifact: `thinaticsystem-verification-${process.env.GITHUB_SHA}` }, null, 2) + '\n');
          NODE
      - name: Current performance contract fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: corepack pnpm run test:performance-contract
      - name: Actual-browser recorder canaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: corepack pnpm run test:performance-recorder
      - name: Native menu motion regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/performance/verify-menu-motion.mjs --dist dist/app/browser --output .artifacts/menu-motion
      - name: Candidate browser functionality and accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: corepack pnpm run test:e2e
      - name: Calibrated same-runner current performance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: corepack pnpm run perf:current
      - name: TypeDoc
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: corepack pnpm run docs:check
      - name: Fixture-only local HTTP contract smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: corepack pnpm run deploy:check
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thinaticsystem-verification-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true # evidence directory is intentionally hidden
          retention-days: 14
          path: |
            dist/app/browser/
            .artifacts/preview-provenance.json
            .artifacts/paired-ci/
            .artifacts/performance-v2/
            .artifacts/performance-v3/
            .artifacts/performance-recorder/
            .artifacts/menu-motion/
            .artifacts/browser*.json
            .artifacts/browser*.png
            .artifacts/screenshots/
            .artifacts/axe-*.json
            .artifacts/partial-failure.json
            .artifacts/known-defects*
            .artifacts/known-defect-runner-probes/
            .artifacts/typedoc/

  preview:
    name: deploy verified artifact to Pages preview
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chore/modernization-renovate' && github.repository == 'ThinaticSystem/thinaticsystem.com' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
    steps:
      - name: Download exact verification artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: thinaticsystem-verification-${{ github.sha }}
          path: .
      - name: Verify artifact provenance
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const { readFileSync, statSync } = require('node:fs');
          const p = JSON.parse(readFileSync('.artifacts/preview-provenance.json', 'utf8'));
          if (p.schema !== 1 || p.sha !== process.env.EXPECTED_SHA || p.repository !== process.env.EXPECTED_REPOSITORY || p.artifact !== `thinaticsystem-verification-${process.env.EXPECTED_SHA}`) throw new Error('artifact provenance mismatch');
          statSync('dist/app/browser/index.html');
          NODE
      - name: Deploy verified preview artifact
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.136.1
          packageManager: pnpm
          command: pages deploy dist/app/browser --project-name=thinaticsystem-com --branch=chore-modernization-renovate
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Read back preview and CMS paths
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/preview-smoke.mjs "$DEPLOYMENT_URL"
