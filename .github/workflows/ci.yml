name: CI

on:
  push:
    branches: [master, develop, 'chore/**']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: thinaticsystem-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, tests, browser, docs, delivery checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
      - name: Enable Corepack
        run: |
          corepack enable
          corepack pnpm --version
      - name: Install dependencies
        run: |
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Typecheck
        run: corepack pnpm run typecheck
      - name: Lint
        run: corepack pnpm run lint
      - name: Unit tests
        run: corepack pnpm run test
      - name: Known-defect contract fixtures
        run: corepack pnpm run test:known-defects:contract
      - name: Known-defect raw gate
        run: corepack pnpm run test:known-defects
      - name: Production build
        run: NG_BUILD_MAX_WORKERS=2 corepack pnpm run build
      - name: Install Chromium
        run: corepack pnpm exec playwright install chromium
      - name: Browser, accessibility, keyboard and mobile smoke
        env:
          EVIDENCE_OUTPUT: .artifacts/browser-smoke.json
          EVIDENCE_DIR: .artifacts/screenshots
        run: corepack pnpm run test:e2e
      - name: Performance comparison
        env:
          EVIDENCE_OUTPUT: .artifacts/browser-smoke.json
          CANDIDATE_SHA: ${{ github.sha }}
        run: corepack pnpm run perf:check
      - name: TypeDoc
        run: corepack pnpm run docs:check
      - name: Cloudflare-compatible local delivery smoke
        run: corepack pnpm run deploy:check
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thinaticsystem-verification-${{ github.sha }}
          if-no-files-found: warn
          path: .artifacts/
