name: Renovate configuration

on:
  push:
    branches: [master, develop, 'chore/**']
    paths: ['renovate.json', '.github/workflows/renovate-config.yml']
  pull_request:
    branches: [master, develop]
    paths: ['renovate.json', '.github/workflows/renovate-config.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: "44.103.7"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Validate Renovate configuration
        run: npm exec --yes --package="renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global renovate.json
