<div class="mx-auto py-12 max-w-7xl lg:py-24 min-h-screen">
  <div class="space-y-12 lg:grid lg:grid-cols-3 lg:gap-8 lg:space-y-0">
    <div class="space-y-5 sm:space-y-4">
      <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">{{ tag() }}</h1>
      <a routerLink="/blog" class="inline-block py-4 underline">記事一覧へ</a>
    </div>
    <div class="lg:col-span-2">
      @if (error()) {
        <div role="alert"><p>記事を読み込めませんでした</p><button type="button" class="underline" (click)="loadTag()">再試行</button></div>
      } @else if (!blogs()) {
        <p role="status" class="sr-only">記事を読み込み中…</p>
      }
      @if (blogs()?.length) {
        <div class="mt-6 grid grid-cols-1 gap-x-8 gap-y-8 sm:grid-cols-2 sm:gap-y-10">
          @for (data of blogs() | orderBy: 'created_at' | reverse | paginate: {
            itemsPerPage: 6,
            currentPage: page()
          }; track data) {
            <app-blog-card [data]="data"></app-blog-card>
          }
        </div>
        <div class="text-center my-12">
          <pagination-controls (pageChange)="changePage($event)"></pagination-controls>
        </div>
      } @else if (blogs() && !error()) {
        <div class="animate__animated animate__fadeIn">
          <p class="text-2xl font-semibold text-gray-600">記事が見つかりませんでした</p>

        </div>
      }
    </div>
  </div>
</div>
