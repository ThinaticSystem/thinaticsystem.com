<div class="bg-white dark:bg-gray-800">
  <div class="mx-auto py-12 max-w-7xl lg:py-24">
    <div class="space-y-12 lg:grid lg:grid-cols-3 lg:gap-8 lg:space-y-0">
      <div class="space-y-5 sm:space-y-4">
        <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">Discography</h1>
      </div>
      <div class="lg:col-span-2">
        <ul class="space-y-12 sm:grid sm:grid-cols-2 sm:gap-x-6 sm:gap-y-12 sm:space-y-0 lg:gap-x-8" role="list">

          @for (data of discographies() | orderBy: 'release' | reverse; track data) {
            <li>
              <a [routerLink]="'/discography/' + data.id" class="space-y-4 cursor-pointer">
                <div class="artwork">
                  @if (data?.artwork) {
                    <img (load)="imageLoaded()"
                         [alt]="$safeNavigationMigration(data?.artwork.alternativeText)"
                         [src]="environment.cmsUrl + data?.artwork.formats.small.url" width="100%">
                  }
                  @if (!data?.artwork) {
                    <img (load)="imageLoaded()"
                         [src]="environment.cmsUrl + '/uploads/noimage_f16114bd25.png'" alt="画像がありません">
                  }
                </div>
                <div class="text-lg leading-6 font-medium space-y-1">
                  <h2>{{ data.title }}</h2>
                  <p class="opacity-50">{{ data.release | date: 'yyyy/MM/dd' }}</p>
                </div>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>
  </div>
</div>
